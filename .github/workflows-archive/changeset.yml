name: Changeset

on:
  # auto-triggers removed for the Asphodel fork — upstream MUD CI is not run here.
  workflow_dispatch:

jobs:
  changeset:
    name: Validate changeset
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Changeset
        run: pnpm changeset status --since origin/main

name: Lint

on:
  # auto-triggers removed for the Asphodel fork — upstream MUD CI is not run here.
  workflow_dispatch:

jobs:
  lint:
    name: Run lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint
